<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00c4cc"/>
      <stop offset="0.38" stop-color="#4a5cff"/>
      <stop offset="0.72" stop-color="#8b3dff"/>
      <stop offset="1" stop-color="#ff2e93"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pinkGlow">
      <stop offset="0" stop-color="#ff2e93" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff2e93" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealGlow">
      <stop offset="0" stop-color="#00e5d4" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#00e5d4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>

  <!-- soft glows -->
  <circle cx="230" cy="180" r="420" fill="url(#glow)"/>
  <circle cx="1420" cy="880" r="460" fill="url(#pinkGlow)"/>
  <circle cx="1350" cy="120" r="320" fill="url(#glow)" opacity="0.6"/>
  <circle cx="120" cy="900" r="360" fill="url(#tealGlow)"/>

  <!-- outlined rings -->
  <g fill="none" stroke="#ffffff">
    <circle cx="1460" cy="230" r="150" stroke-width="2" opacity="0.35"/>
    <circle cx="1460" cy="230" r="215" stroke-width="1.5" opacity="0.2"/>
    <circle cx="170" cy="760" r="120" stroke-width="2" opacity="0.3"/>
    <circle cx="170" cy="760" r="180" stroke-width="1.5" opacity="0.18"/>
  </g>

  <!-- gentle wave along the bottom -->
  <path d="M0 860 C 260 800, 520 930, 800 870 S 1340 800, 1600 860 L 1600 1000 L 0 1000 Z" fill="#ffffff" opacity="0.12"/>
  <path d="M0 920 C 300 870, 560 980, 860 930 S 1360 870, 1600 930 L 1600 1000 L 0 1000 Z" fill="#ffffff" opacity="0.1"/>

  <!-- confetti -->
  <g opacity="0.9">
    <rect x="300" y="420" width="38" height="14" rx="7" fill="#ffd84d" transform="rotate(-28 319 427)"/>
    <rect x="1240" y="520" width="34" height="13" rx="6.5" fill="#ffffff" opacity="0.8" transform="rotate(32 1257 526)"/>
    <rect x="1080" y="140" width="30" height="12" rx="6" fill="#ffd84d" transform="rotate(18 1095 146)"/>
    <rect x="420" y="160" width="28" height="11" rx="5.5" fill="#ffffff" opacity="0.75" transform="rotate(-15 434 165)"/>
    <rect x="1380" y="690" width="32" height="12" rx="6" fill="#00e5d4" transform="rotate(-38 1396 696)"/>
    <rect x="520" y="820" width="30" height="12" rx="6" fill="#ffffff" opacity="0.7" transform="rotate(24 535 826)"/>
    <circle cx="250" cy="560" r="9" fill="#ffffff" opacity="0.8"/>
    <circle cx="1180" cy="330" r="7" fill="#ffffff" opacity="0.7"/>
    <circle cx="1310" cy="420" r="11" fill="#ff2e93"/>
    <circle cx="380" cy="300" r="6" fill="#00e5d4"/>
    <circle cx="1100" cy="760" r="8" fill="#ffd84d"/>
    <circle cx="640" cy="120" r="5" fill="#ffffff" opacity="0.8"/>
    <circle cx="980" cy="880" r="6" fill="#ffffff" opacity="0.7"/>
  </g>

  <!-- sparkles -->
  <g fill="#ffffff">
    <path d="M1180 640 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6 z" opacity="0.85"/>
    <path d="M330 640 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 z" opacity="0.75"/>
    <path d="M1020 240 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z" opacity="0.7"/>
  </g>
</svg>
