AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Lets GitHub Actions deploy the backend without stored access keys: GitHub's
  OIDC provider, and a role that only workflow runs on one repository's main
  branch can assume. The role can roll out a new backend image, nothing more;
  changing the infrastructure itself stays a local, admin-run deploy.

Parameters:
  ProjectName:
    Type: String
    Default: successfulsuccess

  GitHubRepo:
    Type: String
    Description: owner/name of the only repository allowed to assume the role (case-sensitive).
    AllowedPattern: "[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+"

  GitHubOwnerId:
    Type: String
    AllowedPattern: "[0-9]+"
    Description: Numeric id of the repository's owner (api.github.com/repos/<owner>/<name> → owner.id).

  GitHubRepoId:
    Type: String
    AllowedPattern: "[0-9]+"
    Description: Numeric id of the repository (api.github.com/repos/<owner>/<name> → id).

  GitHubBranch:
    Type: String
    Default: main

  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      An account holds one provider per URL. Pass false if
      token.actions.githubusercontent.com is already registered.

Conditions:
  CreateProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      # The audience GitHub puts in tokens meant for AWS STS.
      ClientIdList:
        - sts.amazonaws.com
      # AWS verifies GitHub's certificate itself; the list is only kept for
      # older API contracts that require one.
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-github-deploy"
      Description: !Sub "Assumed by GitHub Actions on ${GitHubRepo}@${GitHubBranch} to deploy the backend"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: GitHubMainBranchOnly
            Effect: Allow
            Principal:
              Federated: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                # The token was issued for AWS...
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # ...by a workflow run on exactly this repository and branch.
                # GitHub's subject names the owner and repository together with
                # their numeric ids, so a repository deleted and re-created
                # under the same name does not match either. StringEquals, not
                # StringLike: no wildcards, so no other repo, branch, tag or
                # pull request matches.
                token.actions.githubusercontent.com:sub: !Sub
                  - "repo:${Owner}@${GitHubOwnerId}/${Name}@${GitHubRepoId}:ref:refs/heads/${GitHubBranch}"
                  - Owner: !Select [0, !Split ["/", !Ref GitHubRepo]]
                    Name: !Select [1, !Split ["/", !Ref GitHubRepo]]
      Policies:
        - PolicyName: deploy-backend
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # `cloudformation deploy` on the ECR and backend stacks. Named
              # stacks only: never this one, or the role could rewrite its own
              # trust policy and permissions.
              - Sid: DeployBackendStacks
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:ListChangeSets
                Resource:
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ProjectName}-ecr/*"
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ProjectName}-backend/*"
              # Read the frontend stack's outputs, to keep the API's CORS origins.
              - Sid: ReadFrontendStack
                Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ProjectName}-frontend/*"
              - Sid: CloudFormationTemplateChecks
                Effect: Allow
                Action:
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ValidateTemplate
                Resource: "*"
              # docker login, push, and look up the pushed image's digest.
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: EcrPushBackendImage
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:DescribeImages
                  - ecr:DescribeRepositories
                Resource: !Sub "arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ProjectName}-backend"
              # The Makefile finds the default VPC and its subnets, and
              # CloudFormation validates the VpcId/SubnetIds parameters. Read-only.
              - Sid: ReadNetwork
                Effect: Allow
                Action:
                  - ec2:DescribeVpcs
                  - ec2:DescribeSubnets
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeNetworkAcls
                Resource: "*"
              # Point the function at the new image, update its environment,
              # and invoke it to run the migrations.
              - Sid: UpdateBackendFunction
                Effect: Allow
                Action:
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:GetFunctionConcurrency
                  - lambda:GetFunctionCodeSigningConfig
                  - lambda:GetFunctionRecursionConfig
                  - lambda:GetFunctionUrlConfig
                  - lambda:GetRuntimeManagementConfig
                  - lambda:GetPolicy
                  - lambda:ListTags
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:InvokeFunction
                Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}-backend"
              # CloudFormation reads the execution role to resolve its ARN for
              # the function, and inspects its policies before the update.
              # Read-only, and only that role.
              - Sid: ReadFunctionRole
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-backend-FunctionRole-*"
              # The function's DATABASE_URL is built from the cluster's endpoint,
              # which CloudFormation looks up on every function update.
              - Sid: ReadDatabaseEndpoint
                Effect: Allow
                Action: rds:DescribeDBClusters
                Resource: !Sub "arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:cluster:${ProjectName}-db"
              # Before a deploy, CloudFormation checks what the caller may do by
              # reading the caller's own policies. Read-only, on this role only.
              - Sid: ReadOwnPolicies
                Effect: Allow
                Action:
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:GetRolePolicy
                  - iam:ListPoliciesGrantingServiceAccess
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-github-deploy"
              # A configuration update re-sends the function's execution role.
              # Only that role, and only to Lambda.
              - Sid: PassFunctionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-backend-FunctionRole-*"
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

Outputs:
  RoleArn:
    Description: role-to-assume for aws-actions/configure-aws-credentials
    Value: !GetAtt DeployRole.Arn
