AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Paste an agenda: a parser function outside the VPC that turns pasted text
  into a suggested agenda with Claude on Amazon Bedrock, behind its own
  function URL. It needs Bedrock and Cognito's public keys, never the
  database, and never writes anything: saving goes through the main API.

Parameters:
  ProjectName:
    Type: String
    Default: successfulsuccess

  ImageUri:
    Type: String
    Description: >-
      The backend image, pinned by digest. The parser runs the same code with
      a different handler.

  Architecture:
    Type: String
    Default: arm64
    AllowedValues: [x86_64, arm64]

  ParserApi:
    Type: String
    Default: mantle
    AllowedValues: [mantle, converse]
    Description: >-
      mantle is the Anthropic Messages API on Bedrock (the current Claude
      models); converse is Bedrock's provider-neutral API.

  ParserModel:
    Type: String
    Default: anthropic.claude-opus-5-5
    Description: Configuration, not code; every log line records which model ran.

  UserPoolId:
    Type: String
    Description: The auth stack's user pool; only its signed-in users may parse.

  UserPoolClientId:
    Type: String
    Description: The auth stack's app client; tokens for any other client are refused.

  AllowedOrigins:
    Type: CommaDelimitedList
    Description: Origins the browser may call the parser from (CORS).

  AlertEmail:
    Type: String
    AllowedPattern: "[^@\\s]+@[^@\\s]+\\.[^@\\s]+"
    Description: Where the monthly budget alarm is sent.

  MonthlyBudgetUsd:
    Type: Number
    Default: 5
    MinValue: 1
    Description: The month's budget for the whole account, in US dollars.

Resources:
  ParserRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Logs only: the function is not in a VPC.
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: call-claude
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # "*" for now, as the lab says; narrowing it to the one model is
              # a discussion question. Only inference: no model management.
              - Sid: MessagesApiOnBedrock
                Effect: Allow
                Action: bedrock-mantle:CreateInference
                Resource: "*"
              - Sid: ConverseApi
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: "*"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ParserLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-agenda-parser"
      RetentionInDays: 14
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ParserFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-agenda-parser"
      Description: Turns pasted text into a suggested agenda with Claude on Bedrock
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        Command: ["app.ai.agenda_lambda.handler"]
      Architectures:
        - !Ref Architecture
      Role: !GetAtt ParserRole.Arn
      MemorySize: 512
      # A parse takes 2–8 s; one retry with the validation error can double it.
      Timeout: 30
      # No VpcConfig: the parser needs Bedrock and Cognito's JWKS on the
      # internet, and no database. Outside the VPC it reaches both with no NAT
      # gateway and no VPC endpoint, and costs nothing while unused.
      Environment:
        Variables:
          PARSER_API: !Ref ParserApi
          PARSER_MODEL: !Ref ParserModel
          BEDROCK_REGION: !Ref AWS::Region
          COGNITO_USER_POOL_ID: !Ref UserPoolId
          COGNITO_CLIENT_ID: !Ref UserPoolClientId
      # JSON logs: each parse's model, tokens, latency and cost are fields.
      LoggingConfig:
        LogGroup: !Ref ParserLogGroup
        LogFormat: JSON
        ApplicationLogLevel: INFO
        SystemLogLevel: WARN
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # Public, like the API's: the handler itself rejects anyone without a valid
  # Cognito access token (401) before any model is called.
  ParserUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt ParserFunction.Arn
      AuthType: NONE
      InvokeMode: BUFFERED
      Cors:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods: [POST]
        AllowHeaders: [authorization, content-type]
        MaxAge: 300

  ParserUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ParserFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  ParserUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ParserFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  # The cheapest insurance in the course: an email when the account's real
  # spend for the month reaches 80% and 100% of the budget. Credits are left
  # out on purpose: with them, the account shows $0 until the credits run out,
  # and the alarm would never fire. Budgets is a global service; this one
  # watches the whole account, not only the parser.
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "${ProjectName}-monthly"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
        CostTypes:
          IncludeCredit: false
          IncludeRefund: false
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
      ResourceTags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

Outputs:
  ParserUrl:
    Description: The parser's endpoint (POST), without the trailing slash
    Value: !Sub ["https://${Host}", {Host: !Select [2, !Split ["/", !GetAtt ParserUrl.FunctionUrl]]}]
  FunctionName:
    Value: !Ref ParserFunction
  LogGroupName:
    Value: !Ref ParserLogGroup
