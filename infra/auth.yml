AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Sign-in for the meetings site: a Cognito user pool with email + password
  self sign-up and Google federation, a public OAuth client for the static
  frontend, and Cognito's managed login (version 2) on a prefix domain.

Parameters:
  ProjectName:
    Type: String
    Default: successfulsuccess

  DomainPrefix:
    Type: String
    AllowedPattern: "[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?"
    Description: >-
      Managed login lives at https://<prefix>.auth.<region>.amazoncognito.com.
      Unique per region across all accounts; may not contain "aws", "amazon"
      or "cognito". Google's OAuth client must list this exact domain.

  CallbackUrls:
    Type: CommaDelimitedList
    Description: >-
      Where Cognito may send the browser back with a code. Must match the
      frontend's redirect_uri exactly, trailing slash included.

  LogoutUrls:
    Type: CommaDelimitedList
    Description: Where Cognito may send the browser after signing out.

  GoogleClientId:
    Type: String
    Description: OAuth client ID of the Google Cloud "Web application" client.

  GoogleClientSecret:
    Type: String
    NoEcho: true
    Description: >-
      OAuth client secret of the Google client. NoEcho keeps it out of the
      console, the CLI output and the stack's parameters listing.

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${ProjectName}-users"
      # Managed login needs Essentials; the first 10,000 monthly users are free.
      UserPoolTier: ESSENTIALS
      # People sign in with their email; there is no separate username.
      UsernameAttributes: [email]
      # Cognito emails a confirmation code to new password users.
      AutoVerifiedAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      # Self sign-up is on: anyone can create an account.
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      # Cognito's built-in sender: 50 emails a day per account, enough for a lab.
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      UserPoolTags:
        PROJECT_NAME: !Ref ProjectName

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: openid email profile
      # Without the mapping a Google user arrives with no email, and the
      # site's header has nothing to show.
      AttributeMapping:
        email: email
        email_verified: email_verified
        name: name

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    # The client names Google as a provider, which must exist first.
    DependsOn: GoogleIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "${ProjectName}-web"
      # A public client: a browser cannot keep a secret, so it gets none and
      # the code exchange is protected by PKCE instead.
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO, Google]
      CallbackURLs: !Ref CallbackUrls
      LogoutURLs: !Ref LogoutUrls
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
      # Sign-in errors do not reveal whether an email has an account.
      PreventUserExistenceErrors: ENABLED

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Ref DomainPrefix
      ManagedLoginVersion: 2

  # A version 2 domain has no sign-in page until the client has a branding.
  # This one matches the site's Canva look: a white card with violet buttons
  # and links on a vivid teal → blue → violet → pink page with confetti, the
  # gradient calendar logo on the card and the wordmark in a see-through header.
  # Colours are RRGGBBAA; settings not listed keep Cognito's defaults. The two
  # images are infra/branding/*.svg, base64-encoded.
  ManagedLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    DependsOn: UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref UserPoolClient
      Settings:
        categories:
          global:
            colorSchemeMode: LIGHT
            pageHeader:
              enabled: true
        components:
          pageBackground:
            image:
              enabled: true
            lightMode:
              # Shown until the background image loads.
              color: 6a4dffff
          pageHeader:
            logo:
              enabled: true
              location: START
            backgroundImage:
              enabled: false
            lightMode:
              # Fully transparent, so the gradient runs under the header.
              background:
                color: ffffff00
              borderColor: ffffff00
          pageText:
            lightMode:
              headingColor: 0f1015ff
              bodyColor: 5b5d66ff
              descriptionColor: 5b5d66ff
          form:
            borderRadius: 24
            logo:
              enabled: true
              location: CENTER
              position: TOP
              formInclusion: IN
            lightMode:
              backgroundColor: ffffffff
              borderColor: ffffffff
          primaryButton:
            lightMode:
              defaults:
                backgroundColor: 8b3dffff
                textColor: ffffffff
              hover:
                backgroundColor: 7d2ae8ff
                textColor: ffffffff
              active:
                backgroundColor: 7d2ae8ff
                textColor: ffffffff
              disabled:
                backgroundColor: e7dbffff
                borderColor: e7dbffff
          secondaryButton:
            lightMode:
              defaults:
                backgroundColor: ffffffff
                borderColor: e7dbffff
                textColor: 7d2ae8ff
              hover:
                backgroundColor: f5efffff
                borderColor: 8b3dffff
                textColor: 7d2ae8ff
              active:
                backgroundColor: ece0ffff
                borderColor: 7d2ae8ff
                textColor: 7d2ae8ff
          idpButton:
            standard:
              lightMode:
                defaults:
                  backgroundColor: ffffffff
                  borderColor: e3e6eeff
                  textColor: 0f1015ff
                hover:
                  backgroundColor: f5efffff
                  borderColor: 8b3dffff
                  textColor: 7d2ae8ff
                active:
                  backgroundColor: ece0ffff
                  borderColor: 7d2ae8ff
                  textColor: 7d2ae8ff
          alert:
            borderRadius: 16
        componentClasses:
          buttons:
            borderRadius: 24
          input:
            borderRadius: 24
            lightMode:
              defaults:
                backgroundColor: ffffffff
                borderColor: e3e6eeff
              placeholderColor: 8a8c94ff
          inputLabel:
            lightMode:
              textColor: 0f1015ff
          focusState:
            lightMode:
              borderColor: 8b3dffff
          link:
            lightMode:
              defaults:
                textColor: 7d2ae8ff
              hover:
                textColor: 8b3dffff
          optionControls:
            lightMode:
              selected:
                backgroundColor: 8b3dffff
                foregroundColor: ffffffff
          divider:
            lightMode:
              borderColor: e7dbffff
      Assets:
        - Category: FORM_LOGO
          ColorMode: LIGHT
          Extension: SVG
          Bytes: 
        - Category: PAGE_HEADER_LOGO
          ColorMode: LIGHT
          Extension: SVG
          Bytes: 
        - Category: PAGE_BACKGROUND
          ColorMode: LIGHT
          Extension: SVG
          Bytes: 

Outputs:
  UserPoolId:
    Value: !Ref UserPool
  ClientId:
    Description: Public OAuth client ID (safe to ship in the frontend build)
    Value: !Ref UserPoolClient
  Authority:
    Description: OIDC issuer the frontend signs in against
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
  CognitoDomain:
    Description: Managed login and logout endpoint
    Value: !Sub "https://${DomainPrefix}.auth.${AWS::Region}.amazoncognito.com"
  GoogleRedirectUri:
    Description: Authorised redirect URI to register on the Google OAuth client
    Value: !Sub "https://${DomainPrefix}.auth.${AWS::Region}.amazoncognito.com/oauth2/idpresponse"
